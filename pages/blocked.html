<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">This site can't be reached</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #292929;
      color: #e8e8e8;
      font-family: Roboto, 'Segoe UI', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Exact layout from screenshot ── */
    .error-wrap {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 88px 0 48px 200px;
    }

    .error-box { max-width: 500px; width: 100%; }

    /* ── Broken-page icon (matches screenshot exactly) ── */
    .icon-wrap { margin-bottom: 20px; }

    /* ── Text ── */
    h1 {
      font-size: 22px;
      font-weight: 400;
      color: #e8e8e8;
      margin-bottom: 10px;
    }

    .sub-line {
      font-size: 14px;
      color: #bdc1c6;
      margin-bottom: 14px;
    }
    .sub-line strong { color: #e8e8e8; font-weight: 500; }

    .try-label {
      font-size: 14px;
      color: #bdc1c6;
      margin-bottom: 4px;
    }

    .try-list { list-style: none; margin-bottom: 16px; }
    .try-list li {
      font-size: 14px;
      padding: 2px 0 2px 16px;
      position: relative;
      line-height: 1.65;
    }
    .try-list li::before { content: '•'; position: absolute; left: 2px; color: #bdc1c6; }
    .try-list li a { color: #8ab4f8; text-decoration: none; }
    .try-list li a:hover { text-decoration: underline; }
    .try-list li.plain { color: #bdc1c6; }

    .error-code {
      font-size: 12.5px;
      color: #7a7a7a;
      letter-spacing: 0.02em;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    /* ── Buttons — Details left, Reload right (exact screenshot layout) ── */
    .btn-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 500px;
    }

    .btn {
      height: 36px;
      padding: 0 18px;
      border-radius: 18px;
      font-size: 13.5px;
      font-weight: 500;
      font-family: Roboto, Arial, sans-serif;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.18);
      outline: none;
      letter-spacing: 0.01em;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-details {
      background: transparent;
      color: #8ab4f8;
      border-color: rgba(138,180,248,0.35);
    }
    .btn-details:hover { background: rgba(138,180,248,0.08); }

    .btn-reload {
      background: rgba(138,180,248,0.15);
      color: #8ab4f8;
      border-color: rgba(138,180,248,0.35);
    }
    .btn-reload:hover { background: rgba(138,180,248,0.25); }

    /* ── Guardian lock — bottom right ── */
    #guardian-lock {
      position: fixed;
      bottom: 22px;
      right: 22px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      opacity: 0.16;
      filter: blur(0.5px);
      transition: opacity 0.25s, filter 0.25s, background 0.2s, transform 0.15s, border-color 0.2s;
      z-index: 8000;
    }
    #guardian-lock:hover {
      opacity: 0.80; filter: blur(0);
      background: rgba(138,180,248,0.14);
      border-color: rgba(138,180,248,0.38);
      transform: scale(1.1);
    }
    #guardian-lock svg { width: 17px; height: 17px; fill: #aaa; pointer-events: none; }

    /* ── Overlay ── */
    #unlock-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.58);
      z-index: 99998;
      display: flex; align-items: center; justify-content: center;
      visibility: hidden; opacity: 0;
      transition: opacity 0.2s, visibility 0.2s;
    }
    #unlock-overlay.open { visibility: visible; opacity: 1; }

    /* ── Popup ── */
    #unlock-popup {
      background: #383838;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 30px 26px 24px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
      position: relative;
      transform: scale(0.9) translateY(10px);
      opacity: 0;
      transition: transform 0.26s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s;
      z-index: 99999;
    }
    #unlock-overlay.open #unlock-popup { transform: scale(1) translateY(0); opacity: 1; }

    #popup-close {
      position: absolute; top: 12px; right: 12px;
      width: 26px; height: 26px; border-radius: 50%;
      border: none; background: transparent;
      color: #777; font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s; padding: 0; line-height: 1;
    }
    #popup-close:hover { background: rgba(255,255,255,0.1); color: #e8e8e8; }

    .popup-icon-ring {
      width: 48px; height: 48px;
      background: rgba(138,180,248,0.14);
      border: 1.5px solid rgba(138,180,248,0.28);
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
    }
    .popup-icon-ring svg { width: 24px; height: 24px; fill: #8ab4f8; }

    #popup-title {
      font-size: 15px; font-weight: 600; color: #e8e8e8;
      text-align: center; margin-bottom: 3px;
    }
    #popup-site {
      font-size: 11.5px; color: #888; text-align: center;
      background: rgba(255,255,255,0.06); border-radius: 20px;
      padding: 2px 10px; display: block;
      margin: 0 auto 18px; width: fit-content;
      font-family: monospace;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .input-wrap { position: relative; margin-bottom: 5px; }
    #pwd-input {
      width: 100%;
      padding: 10px 40px 10px 13px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.14);
      border-radius: 9px;
      font-size: 13.5px; font-family: Roboto, Arial, sans-serif;
      color: #e8e8e8; outline: none;
      transition: border-color 0.15s, background 0.15s;
      letter-spacing: 2px; caret-color: #8ab4f8;
    }
    #pwd-input::placeholder { letter-spacing: 0; color: #555; }
    #pwd-input:focus { border-color: #8ab4f8; background: rgba(138,180,248,0.05); }
    #pwd-input.has-error { border-color: #f28b82; background: rgba(242,139,130,0.06); }

    #eye-btn {
      position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #555; padding: 4px;
      display: flex; align-items: center; transition: color 0.15s;
    }
    #eye-btn:hover { color: #aaa; }
    #eye-btn svg { width: 17px; height: 17px; fill: currentColor; pointer-events: none; }

    #popup-err {
      font-size: 11.5px; color: #f28b82;
      min-height: 17px; margin-bottom: 13px; padding-left: 1px;
    }

    .popup-btns { display: flex; gap: 9px; }
    .pbtn {
      flex: 1; height: 38px; border-radius: 9px;
      font-size: 13.5px; font-weight: 500;
      font-family: Roboto, Arial, sans-serif;
      cursor: pointer; border: none; outline: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .pbtn-cancel { background: rgba(255,255,255,0.09); color: #bdc1c6; }
    .pbtn-cancel:hover { background: rgba(255,255,255,0.14); }
    .pbtn-unlock { background: #8ab4f8; color: #202124; font-weight: 600; }
    .pbtn-unlock:hover { background: #93bbf9; }
    .pbtn-unlock:disabled { opacity: 0.45; cursor: not-allowed; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      18% { transform: translateX(-7px); }
      36% { transform: translateX(7px); }
      54% { transform: translateX(-4px); }
      72% { transform: translateX(4px); }
      88% { transform: translateX(-2px); }
    }
    .shake { animation: shake 0.42s ease; }

    @media (max-width: 680px) {
      .error-wrap { padding: 60px 24px 40px; }
    }
  </style>
</head>
<body>

<div class="error-wrap">
  <div class="error-box">

    <!-- Broken-page icon from screenshot -->
    <div class="icon-wrap">
      <svg width="42" height="46" viewBox="0 0 42 46" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Page outline -->
        <rect x="1" y="1" width="34" height="44" rx="2" stroke="#636363" stroke-width="2" fill="none"/>
        <!-- Fold corner -->
        <polyline points="27,1 27,9 35,9" stroke="#636363" stroke-width="2" fill="none"/>
        <line x1="27" y1="1" x2="35" y2="9" stroke="#636363" stroke-width="2"/>
        <!-- Sad lines on page -->
        <line x1="8" y1="28" x2="18" y2="28" stroke="#636363" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="8" y1="34" x2="26" y2="34" stroke="#636363" stroke-width="2.2" stroke-linecap="round"/>
        <!-- Eyes -->
        <circle cx="12" cy="20" r="2" fill="#636363"/>
        <circle cx="24" cy="20" r="2" fill="#636363"/>
        <!-- Mouth (sad arc) -->
        <path d="M11 25 Q18 22 25 25" stroke="#636363" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>This site can't be reached</h1>
    <p class="sub-line"><strong id="hostname-display">example.com</strong> refused to connect.</p>

    <p class="try-label">Try:</p>
    <ul class="try-list">
      <li class="plain">Checking the connection</li>
      <li><a href="#">Checking the proxy and the firewall</a></li>
    </ul>

    <div class="error-code">ERR_CONNECTION_REFUSED</div>

    <div class="btn-row">
      <button class="btn btn-details" id="btn-details">Details</button>
      <button class="btn btn-reload"  id="btn-reload">Reload</button>
    </div>

  </div>
</div>

<!-- Hidden guardian lock -->
<div id="guardian-lock" tabindex="0" role="button" aria-label="Unlock protected page">
  <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.761-2.239-5-5-5S7 3.239 7 6v2H6c-1.104 0-2 .896-2 2v10c0 1.104.896 2 2 2h12c1.104 0 2-.896 2-2V10c0-1.104-.896-2-2-2zM12 17c-1.104 0-2-.896-2-2s.896-2 2-2 2 .896 2 2-.896 2-2 2zM15.1 8H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
</div>

<!-- Unlock overlay -->
<div id="unlock-overlay">
  <div id="unlock-popup">
    <button id="popup-close">&#x2715;</button>
    <div class="popup-icon-ring">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.761-2.239-5-5-5S7 3.239 7 6v2H6c-1.104 0-2 .896-2 2v10c0 1.104.896 2 2 2h12c1.104 0 2-.896 2-2V10c0-1.104-.896-2-2-2zM12 17c-1.104 0-2-.896-2-2s.896-2 2-2 2 .896 2 2-.896 2-2 2zM15.1 8H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    </div>
    <div id="popup-title">Protected Page</div>
    <span id="popup-site">example.com</span>
    <div class="input-wrap">
      <input type="password" id="pwd-input" placeholder="Enter password to unlock" autocomplete="off" spellcheck="false"/>
      <button id="eye-btn" type="button" tabindex="-1">
        <svg id="eye-svg" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      </button>
    </div>
    <div id="popup-err"></div>
    <div class="popup-btns">
      <button class="pbtn pbtn-cancel" id="btn-cancel">Cancel</button>
      <button class="pbtn pbtn-unlock" id="btn-unlock">Unlock</button>
    </div>
  </div>
</div>

<script src="blocked.js"></script>
</body>
</html>
